<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Consultas</title>

    <link rel="stylesheet" href="style.css?v=20260827-favoritos-novos">
</head>

<body>

    <header>
        <img
            src="logo-diretoria.jpeg"
            class="logo"
            alt="Diretoria Criminal Especializada"
        >

        <h1>Central de Consultas</h1>

        <p>
            Diretoria Criminal Especializada
        </p>
    </header>

    <div class="abas">
        <button
            type="button"
            class="aba"
            onclick="trocarAba('favoritos', this)">
            &#9733; Favoritos
        </button>

        <button
            type="button"
            class="aba ativa"
            onclick="trocarAba('analise', this)">
            &#128196; Modelos - Análise e Cumprimento
        </button>

        <button
            type="button"
            class="aba"
            onclick="trocarAba('possentenca', this)">
            &#9878; Modelos - Pós-Sentença
        </button>

        <button
            type="button"
            class="aba"
            onclick="trocarAba('contatos', this)">
            &#128231; Contatos
        </button>

        <button
            type="button"
            class="aba"
            onclick="trocarAba('convenios', this)">
            &#127970; Convênios
        </button>
    </div>

    <main class="container">
        <section class="painel-controles" aria-label="Controles de pesquisa">
            <div class="linha-pesquisa">
                <input
                    type="text"
                    id="busca"
                    placeholder="Digite sua pesquisa..."
                >

                <button
                    type="button"
                    id="limparBusca"
                    class="botao-secundario">
                    Limpar
                </button>
            </div>

            <div class="linha-filtros">
                <div class="grupo-filtro">
                    <label for="filtroCategoria">
                        Categoria
                    </label>

                    <select id="filtroCategoria">
                        <option value="">
                            Todas as categorias
                        </option>
                    </select>
                </div>

                <fieldset id="grupoFiltroSistema" class="grupo-filtro-sistema">
                    <legend>Sistema</legend>

                    <div class="controle-segmentado">
                        <input type="radio" name="filtroSistema" id="sistemaTodos" value="" checked>
                        <label for="sistemaTodos">Todos</label>

                        <input type="radio" name="filtroSistema" id="sistemaPje" value="PJE">
                        <label for="sistemaPje">PJe</label>

                        <input type="radio" name="filtroSistema" id="sistemaSaj" value="SAJ">
                        <label for="sistemaSaj">SAJ</label>
                    </div>
                </fieldset>

                <fieldset id="grupoFiltroFavoritos" class="grupo-filtro-sistema" hidden>
                    <legend>Tipo de favorito</legend>

                    <div class="controle-segmentado controle-favoritos">
                        <input type="radio" name="filtroFavoritos" id="favoritosTodos" value="" checked>
                        <label for="favoritosTodos">Todos</label>

                        <input type="radio" name="filtroFavoritos" id="favoritosModelos" value="modelo">
                        <label for="favoritosModelos">Modelos</label>

                        <input type="radio" name="filtroFavoritos" id="favoritosConvenios" value="convenio">
                        <label for="favoritosConvenios">Convênios</label>
                    </div>
                </fieldset>

                <div class="resumo-acoes">
                    <p id="contadorResultados" class="contador-resultados">
                        Carregando...
                    </p>

                    <button
                        type="button"
                        id="modoCompacto"
                        class="botao-secundario"
                        aria-pressed="false">
                        Modo compacto
                    </button>
                </div>
            </div>
        </section>

        <div id="resultados"></div>
    </main>

    <button
        type="button"
        id="voltarTopo"
        class="voltar-topo"
        aria-label="Voltar ao topo"
        title="Voltar ao topo">
        &#8593;
    </button>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js?v=20260827-novos-central"></script>

</body>

</html>
